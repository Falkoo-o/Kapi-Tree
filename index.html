<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kapi-Game Warenrechner & Produktionsketten</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #dddddd;
      --primary-color: #2c3e50;
      --accent-color: #3498db;
      --highlight-bg: #eaf2f8;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    h1, h2, h3 {
      color: var(--primary-color);
      margin-top: 0;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
    }

    .panel {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      font-weight: bold;
      font-size: 0.9em;
      margin-bottom: 5px;
      display: block;
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-sizing: border-box;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #2980b9;
    }

    button.secondary {
      background-color: #7f8c8d;
    }

    button.secondary:hover {
      background-color: #6c7a89;
    }

    .tree-view, .summary-view {
      margin-top: 20px;
    }

    ul.tree {
      list-style-type: none;
      padding-left: 20px;
    }

    ul.tree ul {
      list-style-type: none;
      padding-left: 25px;
      border-left: 2px dashed var(--border-color);
    }

    li.tree-item {
      margin: 5px 0;
      position: relative;
    }

    .node-card {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 4px;
      display: inline-block;
      min-width: 250px;
    }

    .node-title {
      font-weight: bold;
    }

    .node-details {
      font-size: 0.85em;
      color: #666;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: left;
    }

    th {
      background-color: var(--highlight-bg);
      color: var(--primary-color);
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    .file-actions {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <h1>Kapi-Game Warenrechner & Produktionsketten</h1>

  <div class="container">
    <!-- LINKES PANAL: Steuerung & Filter -->
    <div class="panel controls-panel">
      <h2>Steuerung</h2>
      
      <div>
        <label for="search">Suchen / Filtern:</label>
        <input type="text" id="search" placeholder="Name, Gebäude, Markt...">
      </div>

      <div>
        <label for="itemSelect">Ware auswählen:</label>
        <select id="itemSelect" size="10"></select>
      </div>

      <div>
        <label for="quantity">Menge:</label>
        <input type="number" id="quantity" value="1" min="0.01" step="any">
      </div>

      <div class="file-actions">
        <h3>Datenbank sichern / laden</h3>
        <div class="btn-group">
          <button id="exportBtn" class="secondary">Export (JSON)</button>
          <button id="importBtn" class="secondary" onclick="document.getElementById('fileInput').click()">Import (JSON)</button>
          <input type="file" id="fileInput" class="hidden" accept=".json">
        </div>
      </div>
    </div>

    <!-- RECHTES PANAL: Ergebnisse & Baumansicht -->
    <div class="panel">
      <div id="detailsHeader">
        <h2>Bitte wähle eine Ware aus</h2>
      </div>

      <div class="summary-view">
        <h3>Gesamter Rohstoffbedarf (kumuliert)</h3>
        <table id="summaryTable">
          <thead>
            <tr>
              <th>Rohstoff / Ware</th>
              <th>Benötigte Menge</th>
              <th>Produzierendes Gebäude</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="3">Keine Auswahl</td></tr>
          </tbody>
        </table>
      </div>

      <div class="tree-view">
        <h3>Produktionsbaum</h3>
        <div id="treeContainer"></div>
      </div>
    </div>
  </div>

      { name: "Sirup", geb: "Mühlenbäckerei", ek: "Müllermeister", vk: "", zutaten: [{n:"Rüben", a:2}, {n:"Wasser", a:2}], sp: [] },
      { name: "Steine", geb: "Steinbruch", ek: "", vk: "", zutaten: [{n:"Werkzeuge", a:0.5}, {n:"Wasser", a:0.5}], sp: ["Königliches Arsenal"] },
      { name: "Stühle", geb: "Schreinerei", ek: "Handwerksmeister", vk: "Handwerkermarkt", zutaten: [{n:"Holz", a:3}, {n:"Werkzeuge", a:1}, {n:"Eisen", a:0.1}], sp: ["Kerker"] },
      { name: "Süßes Brot", geb: "Mühlenbäckerei", ek: "Müllermeister", vk: "Gasthaus", zutaten: [{n:"Mehl", a:3}, {n:"Milch", a:2}, {n:"Honig", a:1}, {n:"Sirup", a:1}, {n:"Trauben", a:1}], sp: ["Kerker"] },
      { name: "Teppiche", geb: "Weberei", ek: "Schneidermeister", vk: "Tuchhändler", zutaten: [{n:"Wolle", a:30}, {n:"Werkzeuge", a:2}], sp: ["Kathedrale", "Gemeindehaus"] },
      { name: "Tische", geb: "Schreinerei", ek: "Handwerksmeister", vk: "Handwerkermarkt", zutaten: [{n:"Holz", a:5}, {n:"Werkzeuge", a:1}, {n:"Eisen", a:0.1}], sp: ["Spital", "Universität", "Gemeindehaus"] },
      { name: "Tran", geb: "Fischerei", ek: "Zuchtmeister", vk: "", zutaten: [{n:"Fische", a:0.1}, {n:"Wasser", a:5}], sp: ["Spital"] },
      { name: "Trauben", geb: "Obstpflückerei", ek: "Klosterabt", vk: "Obstmarkt", zutaten: [{n:"Wasser", a:10}], sp: ["Höfischer Gemüsegarten"] },
      { name: "Trockenfleisch", geb: "Schlachterei", ek: "Zuchtmeister", vk: "Viktualienmarkt", zutaten: [{n:"Schweine", a:0.2}, {n:"Kräuter", a:0.5}], sp: ["Spital", "Stadtwache", "Armenhaus"] },
      { name: "Tuch", geb: "Weberei", ek: "Schneidermeister", vk: "Tuchhändler", zutaten: [{n:"Wolle", a:7}, {n:"Werkzeuge", a:0.1}], sp: ["Spital"] },
      { name: "Wasser", geb: "Quellbrunnen", ek: "", vk: "", zutaten: [], sp: ["Kerker", "Höfischer Gemüsegarten"] },
      { name: "Weihrauch", geb: "Karawanserei", ek: "Diplomaten", vk: "", zutaten: [{n:"Fuhrwerke", a:0.1}, {n:"Pferde", a:0.1}, {n:"Trockenfleisch", a:0.5}, {n:"Schnaps", a:1}], sp: ["Kathedrale"] },
      { name: "Wein", geb: "Brauerei", ek: "Klosterabt", vk: "Gasthaus", zutaten: [{n:"Wasser", a:5}, {n:"Trauben", a:20}, {n:"Fässer", a:0.1}], sp: ["Kathedrale", "Armenhaus"] },
      { name: "Werkzeuge", geb: "Manufaktur", ek: "Handwerksmeister", vk: "", zutaten: [{n:"Eisen", a:0.1}, {n:"Holz", a:0.1}], sp: ["Höfischer Gemüsegarten", "Königliches Arsenal"] },
      { name: "Wild", geb: "Viehzucht", ek: "Zuchtmeister", vk: "", zutaten: [{n:"Wasser", a:30}, {n:"Rüben", a:50}], sp: [] },
      { name: "Wildbret", geb: "Schlachterei", ek: "Zuchtmeister", vk: "Viktualienmarkt", zutaten: [{n:"Wild", a:0.2}, {n:"Kräuter", a:0.5}], sp: ["Kathedrale", "Gemeindehaus"] },
      { name: "Wolle", geb: "Viehzucht", ek: "Zuchtmeister", vk: "", zutaten: [{n:"Wasser", a:0.1}, {n:"Rüben", a:1}], sp: ["Stadtwache", "Armenhaus"] },
      { name: "Ziegen", geb: "Viehzucht", ek: "Zuchtmeister", vk: "Bauernmarkt", zutaten: [{n:"Wasser", a:50}, {n:"Rüben", a:20}], sp: ["Gemeindehaus"] }
    ];

    // Map für schnellen Zugriff
    let dbMap = new Map();

    function buildDatabaseMap() {
      dbMap.clear();
      DATABASE.forEach(item => {
        dbMap.set(item.name, item);
      });
    }

    // ==========================================
    // 2. LOGIK UND BERECHNUNGEN
    // ==========================================

    function getItem(name) {
      return dbMap.get(name) || { name: name, geb: "Unbekannt", zutaten: [] };
    }

    function calculateTotalRequirements(itemName, amount, totals = {}) {
      const item = getItem(itemName);
      if (!item) return totals;

      if (!totals[itemName]) {
        totals[itemName] = { amount: 0, geb: item.geb };
      }
      totals[itemName].amount += amount;

      if (item.zutaten && item.zutaten.length > 0) {
        item.zutaten.forEach(z => {
          calculateTotalRequirements(z.n, z.a * amount, totals);
        });
      }

      return totals;
    }

    function buildTreeHTML(itemName, amount) {
      const item = getItem(itemName);
      
      let html = `<li class="tree-item">`;
      html += `
        <div class="node-card">
          <div class="node-title">${item.name} (${formatNumber(amount)})</div>
          <div class="node-details">
            Gebäude: ${item.geb || '-'}<br>
            ${item.ek ? 'Einkauf: ' + item.ek + '<br>' : ''}
            ${item.vk ? 'Verkauf: ' + item.vk + '<br>' : ''}
            ${item.sp && item.sp.length > 0 ? 'Spende: ' + item.sp.join(', ') : ''}
          </div>
        </div>
      `;

      if (item.zutaten && item.zutaten.length > 0) {
        html += `<ul>`;
        item.zutaten.forEach(z => {
          html += buildTreeHTML(z.n, z.a * amount);
        });
        html += `</ul>`;
      }

      html += `</li>`;
      return html;
    }

    function formatNumber(num) {
      return Number.isInteger(num) ? num : parseFloat(num.toFixed(4));
    }

    // ==========================================
    // 3. UI RENDER & EVENT HANDLER
    // ==========================================

    const itemSelect = document.getElementById('itemSelect');
    const searchInput = document.getElementById('search');
    const quantityInput = document.getElementById('quantity');
    const detailsHeader = document.getElementById('detailsHeader');
    const summaryTableBody = document.querySelector('#summaryTable tbody');
    const treeContainer = document.getElementById('treeContainer');

    function renderSelectOptions(filterText = '') {
      itemSelect.innerHTML = '';
      const filter = filterText.toLowerCase();

      const sortedItems = [...DATABASE].sort((a, b) => a.name.localeCompare(b.name));

      sortedItems.forEach(item => {
        const matchesName = item.name.toLowerCase().includes(filter);
        const matchesGeb = item.geb && item.geb.toLowerCase().includes(filter);
        const matchesVk = item.vk && item.vk.toLowerCase().includes(filter);
        const matchesEk = item.ek && item.ek.toLowerCase().includes(filter);
        const matchesSp = item.sp && item.sp.some(s => s.toLowerCase().includes(filter));

        if (matchesName || matchesGeb || matchesVk || matchesEk || matchesSp) {
          const option = document.createElement('option');
          option.value = item.name;
          option.textContent = `${item.name} (${item.geb})`;
          itemSelect.appendChild(option);
        }
      });
    }

    function updateCalculation() {
      const selectedName = itemSelect.value;
      const quantity = parseFloat(quantityInput.value) || 1;

      if (!selectedName) {
        detailsHeader.innerHTML = '<h2>Bitte wähle eine Ware aus</h2>';
        summaryTableBody.innerHTML = '<tr><td colspan="3">Keine Auswahl</td></tr>';
        treeContainer.innerHTML = '';
        return;
      }

      const item = getItem(selectedName);

      // Header-Details
      detailsHeader.innerHTML = `
        <h2>${item.name}</h2>
        <p>
          <strong>Gebäude:</strong> ${item.geb || '-'} | 
          <strong>Einkauf:</strong> ${item.ek || '-'} | 
          <strong>Verkauf:</strong> ${item.vk || '-'}
          ${item.sp && item.sp.length > 0 ? `<br><strong>Spende bei:</strong> ${item.sp.join(', ')}` : ''}
        </p>
      `;

      // 1. Gesamte Rohstoffe berechnen
      const totals = calculateTotalRequirements(selectedName, quantity);
      summaryTableBody.innerHTML = '';
      
      Object.keys(totals).sort().forEach(name => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${name}</strong></td>
          <td>${formatNumber(totals[name].amount)}</td>
          <td>${totals[name].geb}</td>
        `;
        summaryTableBody.appendChild(row);
      });

      // 2. Produktionsbaum rendern
      treeContainer.innerHTML = `<ul class="tree">${buildTreeHTML(selectedName, quantity)}</ul>`;
    }

    // Events
    searchInput.addEventListener('input', (e) => {
      renderSelectOptions(e.target.value);
    });

    itemSelect.addEventListener('change', updateCalculation);
    quantityInput.addEventListener('input', updateCalculation);

    // ==========================================
    // 4. EXPORT & IMPORT FUNKTIONEN
    // ==========================================

    document.getElementById('exportBtn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(DATABASE, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "kapi_bom_database.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const importedData = JSON.parse(evt.target.result);
          if (Array.isArray(importedData)) {
            DATABASE = importedData;
            buildDatabaseMap();
            renderSelectOptions();
            alert('Datenbank erfolgreich importiert!');
          } else {
            alert('Ungültiges Format: Das JSON muss ein Array von Waren sein.');
          }
        } catch (err) {
          alert('Fehler beim Lesen der JSON-Datei: ' + err.message);
        }
      };
      reader.readAsText(file);
    });

    // ==========================================
    // INITIALISIERUNG
    // ==========================================
    buildDatabaseMap();
    renderSelectOptions();
  </script>
</body>
</html>
